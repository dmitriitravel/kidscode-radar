name: Deploy to GitHub Pages

# Публикует лендинг «Домашний лицей» на GitHub Pages.
# Прод-URL после включения Pages: https://dmitriitravel.github.io/kidscode-radar/

on:
  push:
    branches:
      - main
      - cursor/skysmart-homeschooling-clone-a42c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать сайт (самостоятельный standalone.html как корень)
        run: |
          mkdir -p _site
          cp standalone.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
